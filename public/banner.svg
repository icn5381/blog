<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <!-- 墨 × 朱 编辑部横幅：墨底、超大衬线字标、朱红印章 -->
  <rect width="1600" height="480" fill="#161616"/>

  <!-- 细框（版式感） -->
  <rect x="28" y="28" width="1544" height="424" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- 主字标：超大衬线 -->
  <text x="96" y="292" font-family="'Noto Serif SC','Songti SC',serif" font-size="150" font-weight="700" fill="#f2efe9" letter-spacing="14">拾光集</text>

  <!-- 英文小字（对比） -->
  <text x="104" y="336" font-family="Georgia,serif" font-size="20" fill="#8a8a8a" letter-spacing="6">SHIGUANG · NOTES ON TECH, AI &amp; GROWTH</text>

  <!-- 朱红印章 -->
  <g>
    <rect x="1348" y="96" width="128" height="128" fill="#c9402e"/>
    <text x="1412" y="186" font-family="'Noto Serif SC','Songti SC',serif" font-size="84" font-weight="700" fill="#f2efe9" text-anchor="middle">拾</text>
  </g>

  <!-- 底部排版线与页码感 -->
  <line x1="96" y1="384" x2="560" y2="384" stroke="#4a4a4a" stroke-width="1"/>
  <text x="96" y="416" font-family="Georgia,serif" font-size="15" fill="#6a6a6a" letter-spacing="3">VOL.01 — 一个程序员的博客</text>
  <text x="1440" y="416" font-family="Georgia,serif" font-size="15" fill="#6a6a6a" text-anchor="end">EST. 2026</text>

  <!-- 右上角小注 -->
  <text x="1412" y="72" font-family="Georgia,serif" font-size="13" fill="#555" text-anchor="end" letter-spacing="2">INK / VERMILION / SERIF</text>
</svg>
